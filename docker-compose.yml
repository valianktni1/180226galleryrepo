version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: wbm-mongodb
    restart: unless-stopped
    volumes:
      - /mnt/apps/newweddingsbymarkgallery/mongodb:/data/db
    networks:
      - wbm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wbm-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=weddings_by_mark
      - CORS_ORIGINS=*
      - JWT_SECRET=change-this-to-a-strong-random-secret
      - UPLOAD_DIR=/data/userfiles
    volumes:
      - /mnt/nextcloud/newwedidngsbymarkuserfiles:/data/userfiles
    depends_on:
      - mongodb
    networks:
      - wbm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=http://YOUR_SERVER_IP:3037
    container_name: wbm-frontend
    restart: unless-stopped
    ports:
      - "3037:80"
    depends_on:
      - backend
    networks:
      - wbm-network

networks:
  wbm-network:
    driver: bridge
