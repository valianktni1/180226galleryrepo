server {
    listen 8090;
    server_name _;

    # Secret for secure_link validation — set via env var
    set $secure_link_secret "${NGINX_VIDEO_SECRET}";

    client_max_body_size 0;

    location /video/ {
        # Validate signed URL: md5(secret + uri + expires)
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_secret$uri$arg_expires";

        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }

        # Strip /video/ prefix and serve from uploads directory
        alias /uploads/;

        # High-performance file serving
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        aio on;
        directio 4m;
        output_buffers 2 1m;

        types {
            video/mp4                mp4;
            video/quicktime          mov;
            video/webm               webm;
            video/x-msvideo          avi;
            video/x-matroska         mkv;
            video/mp2t               mts;
        }

        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD";
        add_header Access-Control-Allow-Headers "Range";

        if ($request_method = OPTIONS) { return 204; }
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
