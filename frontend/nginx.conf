server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Low-risk browser hardening that does not change gallery functionality.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Increase timeouts for large uploads
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Static assets with hashed filenames — cache aggressively
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker may advertise both IPv4 and IPv6 for service names. Uvicorn is
        # intentionally listening on IPv4, so prevent NGINX selecting an IPv6
        # upstream that cannot accept the connection.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_upstream http://backend:8001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow large file uploads (40GB for 4K videos)
        client_max_body_size 40G;
        
        # Streaming upload support
        proxy_request_buffering off;
        proxy_buffering off;
        
        # Extended timeouts for large uploads
        proxy_connect_timeout 600;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
    }

    location /video/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $video_upstream http://nginx-video:8090;
        proxy_pass $video_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 3600;
    }
}
